name: Repository checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python and disposable Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ara_test
          POSTGRES_PASSWORD: fictional-ci-password
          POSTGRES_DB: ara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ara_test -d ara_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Only this job's disposable container. Never use deployment secrets.
      ARA_MAP_TEST_DATABASE_URL: postgresql://ara_test:fictional-ci-password@127.0.0.1:5432/ara_test
      DATABASE_URL: ""
      ARA_MAP_DATABASE_URL: ""
      ARA_MAP_IA_PROVEEDOR: ""
      OPENAI_API_KEY: ""
      ARA_MAP_IA_CLAVE: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Postgres test driver
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Run Python tests including real Postgres
        run: python -m unittest discover -s tests -t .

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Run component and state tests
        run: node --test tests/js/*.test.mjs
